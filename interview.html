<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>BlinkScroll — calibration interview</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
         background: #0e0e10; color: #f5f5f7; font-family: system-ui, sans-serif; }
  .card { width: 560px; max-width: 92vw; background: #131316; border: 1px solid #2d2d36;
          border-radius: 16px; padding: 32px; }
  h1 { font-size: 20px; margin: 0 0 6px; }
  .lede { color: #a8a8b5; font-size: 14px; margin-bottom: 18px; line-height: 1.5; }
  .dots { display: flex; gap: 8px; margin-bottom: 22px; }
  .dots span { flex: 1; height: 4px; border-radius: 2px; background: #2d2d36; }
  .dots span.done { background: #0d5c46; }
  .dots span.now { background: #4574f7; }
  .stage { position: relative; width: 100%; aspect-ratio: 4/3; background: #000;
           border-radius: 12px; overflow: hidden; margin-bottom: 16px; }
  video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
  .face-ring { position: absolute; inset: 18%; border: 3px dashed #555; border-radius: 24px;
               transition: border-color .2s; pointer-events: none; }
  .face-ring.ok { border-color: #11b086; border-style: solid; }
  .instr { font-size: 16px; line-height: 1.55; margin-bottom: 12px; }
  .instr b { color: #49f3c6; }
  .status { font-size: 13px; color: #a8a8b5; min-height: 20px; margin-bottom: 8px; }
  .status .good { color: #49f3c6; }
  .status .warn { color: #e0a63c; }
  .bar { height: 8px; background: #2d2d36; border-radius: 4px; overflow: hidden; margin-bottom: 18px; }
  .bar i { display: block; height: 100%; width: 0; background: #4574f7; border-radius: 4px;
           transition: width .15s; }
  .btns { display: flex; gap: 10px; }
  button { flex: 1; padding: 12px; border-radius: 10px; border: 1px solid #2d2d36; font-size: 14px;
           background: #17171c; color: #f5f5f7; cursor: pointer; }
  button:hover { background: #1e1e24; }
  button.primary { background: #0d5c46; border-color: #0d5c46; font-weight: 600; }
  button.primary:hover { background: #0e6b52; }
  button.ghost { flex: 0 0 auto; padding: 12px 18px; }
  .review { font-size: 14px; line-height: 2; background: #101013; border: 1px solid #222228;
            border-radius: 10px; padding: 16px 20px; margin-bottom: 18px; }
  .review b { color: #49f3c6; font-weight: 600; }
  .skip { display: block; margin: 14px auto 0; background: none; border: none; color: #6b6b76;
          font-size: 12px; cursor: pointer; text-decoration: underline; }
  .done-icon { font-size: 44px; text-align: center; margin-bottom: 12px; }
</style>
</head>
<body>
<div class="card">
  <div class="dots" id="dots"></div>
  <h1 id="title">BlinkScroll calibration</h1>
  <div class="lede" id="lede"></div>
  <div class="stage" id="stage">
    <video id="cam" autoplay muted playsinline></video>
    <div class="face-ring" id="ring"></div>
  </div>
  <!-- Sandboxed WASM detector (MV3 forbids WebAssembly in extension pages).
       Hidden; it only needs frames via postMessage. -->
  <iframe id="detector" src="sandbox/detect.html" sandbox="allow-scripts"
          style="width:2px;height:2px;position:absolute;opacity:0;pointer-events:none"></iframe>
  <div class="instr" id="instr"></div>
  <div class="status" id="status"></div>
  <div class="bar"><i id="bar"></i></div>
  <div class="btns" id="btns"></div>
  <button class="skip" id="skip">skip for now — use defaults</button>
</div>
<script type="module" src="interview.js"></script>
</body>
</html>
