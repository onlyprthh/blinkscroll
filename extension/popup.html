<!DOCTYPE html>
<html>
<head><meta charset="utf-8">
<style>
  body { width: 260px; margin: 0; padding: 16px; font-family: system-ui, sans-serif;
         background: #101014; color: #f5f5f7; }
  h1 { font-size: 15px; margin: 0 0 4px; }
  .sub { font-size: 12px; color: #a8a8b5; margin-bottom: 14px; }
  .row { display: flex; align-items: center; justify-content: space-between;
         padding: 10px 0; border-top: 1px solid #2d2d36; font-size: 13px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; margin-right: 7px;
         background: #555; vertical-align: 1px; }
  .dot.on { background: #11b086; box-shadow: 0 0 6px #11b086; }
  .dot.warn { background: #e0a63c; }
  button { width: 100%; margin-top: 8px; padding: 9px; border: 1px solid #2d2d36; border-radius: 8px;
           background: #17171c; color: #f5f5f7; font-size: 13px; cursor: pointer; }
  button:hover { background: #1e1e24; }
  button.primary { background: #0d5c46; border-color: #0d5c46; }
  button.primary:hover { background: #0e6b52; }
  .switch { position: relative; width: 40px; height: 22px; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .track { position: absolute; inset: 0; border-radius: 11px; background: #2d2d36; cursor: pointer; }
  .track:before { content: ""; position: absolute; width: 16px; height: 16px; left: 3px; top: 3px;
                  border-radius: 50%; background: #a8a8b5; transition: .15s; }
  .switch input:checked + .track { background: #0d5c46; }
  .switch input:checked + .track:before { transform: translateX(18px); background: #fff; }
  .foot { margin-top: 12px; font-size: 11px; color: #6b6b76; text-align: center; }
</style>
</head>
<body>
  <h1>👁 BlinkScroll</h1>
  <div class="sub" id="calibLine">scroll reels with your blinks</div>
  <div class="row">
    <span>Enabled</span>
    <label class="switch"><input type="checkbox" id="enabled"><span class="track"></span></label>
  </div>
  <div class="row"><span><span class="dot" id="camDot"></span>Camera</span><span id="camState">–</span></div>
  <div class="row"><span><span class="dot" id="faceDot"></span>Face</span><span id="faceState">–</span></div>
  <button id="recal">Re-run calibration interview</button>
  <button id="how">How it works</button>
  <div class="foot">100% on-device · nothing leaves your laptop</div>
  <script src="popup.js"></script>
</body>
</html>
